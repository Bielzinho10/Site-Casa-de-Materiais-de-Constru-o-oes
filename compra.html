<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra Efetuada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Resumo da Compra</h2>
    <div class="card mt-4">
      <div class="card-body">
        <p><strong>Produto:</strong> <span id="produto"></span></p>
        <p><strong>Quantidade:</strong> <span id="quantidade"></span></p>
        <p><strong>Preço Unitário:</strong> R$ <span id="preco"></span></p>
        <p><strong>Total:</strong> R$ <span id="total"></span></p>
        <div class="text-center mt-4">
          <a href="produtos.html" class="btn btn-primary">Voltar para Produtos</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const produto = params.get("produto");
    const preco = parseFloat(params.get("preco"));
    const quantidade = parseInt(params.get("quantidade"));
    const total = (preco * quantidade).toFixed(2);

    document.getElementById("produto").textContent = produto;
    document.getElementById("quantidade").textContent = quantidade;
    document.getElementById("preco").textContent = preco.toFixed(2);
    document.getElementById("total").textContent = total;
  </script>
</body>
</html>
